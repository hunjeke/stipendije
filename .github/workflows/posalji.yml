name: Pošalji obavijesti

# Slanje mailova pretplatnicima kroz Brevo API.
#
# Zadano je proba: ispiše kome bi što otišlo i ne pošalje ništa.
# Tek "salji" stvarno šalje. Pokreće se rukom, nikad po rasporedu —
# mail koji ode ne može se povući.

on:
  workflow_dispatch:
    inputs:
      nacin:
        description: "proba · nacrt · salji · pocisti (briše [auto] nacrte i liste)"
        required: true
        default: proba
        type: choice
        options: [proba, nacrt, salji, pocisti]

# Zadnji korak commita poslano.json natrag u repozitorij. Bez ovoga
# github-actions[bot] dobije 403 na push: mailovi odu, ali se ne zabiljezi
# da su otisli — i iduce pokretanje posalje sve jos jednom.
permissions:
  contents: write

jobs:
  posalji:
    runs-on: ubuntu-latest
    # Slanje ide polako: pauza izmedu kampanja, cekanje da Brevo vidi
    # kontakte u listi, i pauze kad odgovori 429. Prekid na pola je ovdje
    # najgori mogu ishod — poslane kampanje se ne mogu povuci, a
    # poslano.json se zapisuje tek na kraju, pa bi iduce pokretanje
    # poslalo isto jos jednom. Zato je granica velikodusna.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instaliraj knjižnice
        run: pip install requests beautifulsoup4 anthropic

      # Mailovi se ne salju ako provjera nesto zaustavlja. Proba i nacrt
      # prolaze uvijek — oni nista ne salju, a korisni su upravo tada.
      - name: Provjeri podatke
        if: inputs.nacin == 'salji'
        run: |
          python provjera.py || {
            echo "::error::Provjera zaustavlja slanje. Pogledaj provjera.md."
            cat provjera.md
            exit 1
          }

      - name: Pokreni
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_UPDATE_FORM_ID: ${{ secrets.BREVO_UPDATE_FORM_ID }}
          BREVO_FROM: ${{ secrets.BREVO_FROM }}
          # ID liste i mape NISU tajne i ne smiju biti tajne. GitHub u
          # zapisniku zacrni svaku pojavu vrijednosti tajne, a ove su
          # jednoznamenkaste — dok su stajale medu tajnama, svaka jedinica
          # i trojka u ispisu postajale su "***": "Novih natjecaja: ***4",
          # "poruka ukupno: ***65". Brojke se nisu dale procitati, a ni
          # provjeriti prije slanja.
          BREVO_LISTA_ID: "3"
          BREVO_FOLDER_ID: "1"
          BREVO_DNEVNO: "300"
        run: |
          case "${{ inputs.nacin }}" in
            proba) python posalji.py ;;
            nacrt) python posalji.py --nacrt ;;
            salji) python posalji.py --salji ;;
            pocisti) python posalji.py --pocisti ;;
          esac

      - name: Spremi predpreglede
        if: inputs.nacin == 'proba'
        uses: actions/upload-artifact@v4
        with:
          name: pregled-maila
          path: pregled-maila/
          if-no-files-found: ignore

      # Poslije slanja poslano.json nosi nove slugove — bez ovoga bi isti
      # natječaji otišli i idući tjedan.
      - name: Zabilježi poslano
        if: inputs.nacin == 'salji'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add poslano.json
          git diff --cached --quiet || git commit -m "poslano: obavijesti $(date +%F)"
          git push
