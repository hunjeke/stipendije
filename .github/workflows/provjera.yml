name: Provjera stipendija

on:
  schedule:
    # Ponedjeljak i cetvrtak u 06:17 UTC (08:17 po hrvatskom ljetnom vremenu).
    #
    # Zasto 06:17, a ne okrugli sat: GitHub posao sa zakazanim vremenom stavlja
    # u red, a na punoj uri red je najduzi jer ondje zakazuje gotovo svatko.
    # Takav posao zna kasniti satima ili biti preskocen — 12.10.2026. ovaj se
    # uopce nije pokrenuo. Neobicna minuta cesto prode odmah.
    - cron: '17 6 * * 1,4'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  provjeri:
    runs-on: ubuntu-latest
    steps:
      - name: Preuzmi kod
        uses: actions/checkout@v4

      - name: Postavi Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instaliraj pakete
        run: pip install anthropic requests beautifulsoup4 pypdf

      - name: Pokreni scraper
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scraper.py
      # Provjera podataka. Ne prekida posao: stranica se objavljuje i kad
      # nesto zapne, jer je stranica s jednom sumnjivom karticom bolja od
      # nikakve. Zaustavlja se slanje mailova i otvara issue.
      - name: Provjeri podatke
        id: kontrola
        continue-on-error: true
        run: python provjera.py

      - name: Generiraj javnu stranicu
        run: python web.py

      # Cak i ako gradnja stranice padne, rezultat citanja mora biti spremljen.
      # Bez 'always()' bi pad web.py-a ostavio .cache.json nespremljen, pa bi
      # sljedeci rad ponovno platio sva citanja koja su vec obavljena.
      - name: Spremi rezultate u repozitorij
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          # Zasebno, iz istog razloga: jedna datoteka koja jos ne postoji
          # inace odnese cijeli git add i run zavrsi "uspjesno" bez icega.
          for f in output.html output.json output.csv .cache.json natjecaji.json .provjera-stanje.json docs; do
            git add -A "$f" || true
          done
          git diff --staged --quiet || git commit -m "Rezultati provjere $(date +'%d.%m.%Y')"
          git push || true

      - name: Sacuvaj rezultate za preuzimanje
        uses: actions/upload-artifact@v4
        with:
          name: rezultati
          path: |
            output.html
            output.json

      - name: Obavijest ako provjera nesto zaustavlja
        if: steps.kontrola.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Provjera zaustavlja slanje ($(date +'%d.%m.%Y'))" \
            --body-file provjera.md \
            --label "provjera" || \
          gh issue create \
            --title "Provjera zaustavlja slanje ($(date +'%d.%m.%Y'))" \
            --body-file provjera.md

      - name: Sacuvaj izvjestaj provjere
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provjera
          path: provjera.md
          if-no-files-found: ignore

      - name: Provjeri sute li izvori
        id: tisina
        run: python provjeri_tisinu.py

      - name: Obavijest o tihim izvorima
        if: steps.tisina.outputs.broj_tihih != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Izvori koji šute: ${{ steps.tisina.outputs.broj_tihih }} ($(date +'%d.%m.%Y'))" \
            --body-file tisina.md

      - name: Provjeri ima li otvorenih stipendija
        id: provjera
        run: |
          python - << 'PYEOF'
          import json, os
          d = json.load(open("output.json", encoding="utf-8"))
          otv = [r for r in d if (r.get("status") or "").startswith("OTVORENO")]
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"broj={len(otv)}\n")
          redovi = []
          for r in otv:
              redovi.append(f"- **{r.get('naziv')}** — {r.get('status')}\n"
                            f"  - Iznos: {r.get('iznos') or 'nepoznato'}\n"
                            f"  - Rok: {r.get('rok_tekst') or 'nepoznato'}\n"
                            f"  - {r.get('url')}")
          open("poruka.md", "w", encoding="utf-8").write("\n".join(redovi) or "nema")
          PYEOF

      - name: Otvori obavijest ako ima otvorenih
        if: steps.provjera.outputs.broj != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Otvorene stipendije: ${{ steps.provjera.outputs.broj }} ($(date +'%d.%m.%Y'))" \
            --body-file poruka.md
