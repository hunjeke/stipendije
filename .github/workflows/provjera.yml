name: Provjera stipendija

on:
  schedule:
    # Ponedjeljak i cetvrtak u 06:17 UTC (08:17 po hrvatskom ljetnom vremenu).
    #
    # Zasto 06:17, a ne okrugli sat: GitHub posao sa zakazanim vremenom stavlja
    # u red, a na punoj uri red je najduzi jer ondje zakazuje gotovo svatko.
    # Takav posao zna kasniti satima ili biti preskocen — 12.10.2026. ovaj se
    # uopce nije pokrenuo. Neobicna minuta cesto prode odmah.
    - cron: '17 6 * * 1,4'
    # Dvije dopune istoga dana. Zakazani posao na GitHubu nije jamstvo nego
    # mogucnost: 12.10. i 26.10.2026. jutarnji se nije pokrenuo uopce, pa je
    # stranica tjedan dana pokazivala rokove koji su u meduvremenu istekli.
    # Dopuna prvo pogleda jesu li podaci od danas i, ako jesu, odmah stane —
    # kosta dvadesetak sekundi i nijedan poziv modelu.
    - cron: '23 11 * * 1,4'
    - cron: '41 16 * * 1,4'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

# Dvije provjere ne smiju ici istodobno. GitHub zakazani posao zna krenuti
# satima kasnije, pa se 9.11.2026. poklopio s rucno pokrenutom: obje su
# radile pedeset minuta, a druga nije mogla spremiti rezultate (push odbijen
# tri puta). Ovako druga ceka u redu, a kad krene, "treba-li" vidi da su
# podaci vec od danas i stane za nekoliko sekundi.
concurrency:
  group: provjera
  cancel-in-progress: false

jobs:
  # Prvi posao samo odgovara na pitanje "jesu li podaci vec od danas".
  # Rucno pokretanje uvijek prolazi — kad covjek pritisne gumb, hoce da se
  # radi, bez obzira na to sto je jutros vec proslo.
  treba-li:
    runs-on: ubuntu-latest
    outputs:
      ide: ${{ steps.p.outputs.ide }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: |
          python - << 'PYEOF'
          import json, os, datetime
          rucno = os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch"
          try:
              d = json.load(open("output.json", encoding="utf-8"))
              zadnji = max((r.get("zadnje_provjereno") or "")[:10] for r in d)
          except Exception:
              zadnji = ""
          danas = datetime.date.today().isoformat()
          ide = "da" if (rucno or zadnji != danas) else "ne"
          print(f"zadnji scrape: {zadnji or 'nepoznat'} | danas: {danas} | "
                f"rucno: {rucno} -> {ide}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"ide={ide}\n")
          PYEOF

  provjeri:
    needs: treba-li
    if: needs.treba-li.outputs.ide == 'da'
    runs-on: ubuntu-latest
    steps:
      - name: Preuzmi kod
        uses: actions/checkout@v4

      - name: Postavi Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instaliraj pakete
        run: pip install anthropic requests beautifulsoup4 pypdf

      - name: Pokreni scraper
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scraper.py
      # Provjera podataka. Ne prekida posao: stranica se objavljuje i kad
      # nesto zapne, jer je stranica s jednom sumnjivom karticom bolja od
      # nikakve. Zaustavlja se slanje mailova i otvara issue.
      - name: Provjeri podatke
        id: kontrola
        continue-on-error: true
        run: python provjera.py

      - name: Generiraj javnu stranicu
        run: python web.py

      # Cak i ako gradnja stranice padne, rezultat citanja mora biti spremljen.
      # Bez 'always()' bi pad web.py-a ostavio .cache.json nespremljen, pa bi
      # sljedeci rad ponovno platio sva citanja koja su vec obavljena.
      - name: Spremi rezultate u repozitorij
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          # Zasebno, iz istog razloga: jedna datoteka koja jos ne postoji
          # inace odnese cijeli git add i run zavrsi "uspjesno" bez icega.
          for f in output.html output.json output.csv .cache.json natjecaji.json .provjera-stanje.json docs; do
            git add -A "$f" || true
          done
          if git diff --staged --quiet; then
            echo "nema promjena za spremiti"
            exit 0
          fi
          git commit -m "Rezultati provjere $(date +'%d.%m.%Y')"
          # Dok rad traje, netko moze gurnuti u main — runner je kod preuzeo
          # na starijem commitu, pa mu push vise ne prolazi. 29.10.2026. se
          # tocno to dogodilo: 21 minuta citanja, commit sa 119 datoteka, i
          # "! [rejected] main -> main". Stari "git push || true" je taj kvar
          # progutao, pa je rad ostao zelen, a rezultata nije bilo nigdje.
          #
          # Zato: tri pokusaja s rebaseom na ono sto je u meduvremenu doslo,
          # a ako ni treci ne prode, korak pada glasno umjesto da sute.
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then
              echo "spremljeno iz $i. pokusaja"
              exit 0
            fi
            echo "push nije prosao ($i/3) — pokusavam ponovno"
            sleep 5
          done
          echo "::error::Rezultati provjere nisu spremljeni — push odbijen tri puta"
          exit 1

      # Bez 'always()' bi pad spremanja odnio i jedini preostali primjerak
      # rezultata — a bas tada je najpotrebniji.
      - name: Sacuvaj rezultate za preuzimanje
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rezultati
          path: |
            output.html
            output.json

      # Jedna prijava koja se osvjezava, ne nova svaki put.
      #
      # 29.10.2026. su tri rada istoga dana otvorila tri jednake prijave, a
      # do 2.11. ih se nakupilo 83 — nijednu nitko nije zatvorio ni citao.
      # Kad je sve otvoreno, nista nije upozorenje. Zato se drzi jedna
      # prijava po vrsti: osvjezi se dok problem traje i zatvori se sama
      # kad prode, pa otvorena prijava opet nesto znaci.
      - name: Prijava ako provjera nesto zaustavlja
        if: always() && steps.kontrola.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create provjera --color d73a4a \
            --description "Provjera zaustavlja slanje" 2>/dev/null || true
          NASLOV="Provjera zaustavlja slanje ($(date +'%d.%m.%Y'))"
          N=$(gh issue list --state open --label provjera --limit 1 \
                --json number --jq '.[0].number // empty')
          if [ -n "$N" ]; then
            gh issue edit "$N" --title "$NASLOV" --body-file provjera.md
          else
            gh issue create --title "$NASLOV" --body-file provjera.md --label provjera
          fi

      # Kad provjera vise nista ne zaustavlja, prijava se zatvara sama.
      - name: Zatvori prijavu kad provjera prode
        if: always() && steps.kontrola.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for N in $(gh issue list --state open --label provjera \
                       --json number --jq '.[].number'); do
            gh issue close "$N" --comment "Provjera je prošla bez zaustavljanja $(date +'%d.%m.%Y')."
          done

      - name: Sacuvaj izvjestaj provjere
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provjera
          path: provjera.md
          if-no-files-found: ignore

      - name: Provjeri sute li izvori
        id: tisina
        run: python provjeri_tisinu.py

      # I ovdje jedna prijava koja se osvjezava — popis tihih izvora se
      # mijenja iz tjedna u tjedan, pa je stara verzija bezvrijedna.
      - name: Prijava o tihim izvorima
        if: steps.tisina.outputs.broj_tihih != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create tisina --color fbca04 \
            --description "Izvori koji šute" 2>/dev/null || true
          NASLOV="Izvori koji šute: ${{ steps.tisina.outputs.broj_tihih }} ($(date +'%d.%m.%Y'))"
          N=$(gh issue list --state open --label tisina --limit 1 \
                --json number --jq '.[0].number // empty')
          if [ -n "$N" ]; then
            gh issue edit "$N" --title "$NASLOV" --body-file tisina.md
          else
            gh issue create --title "$NASLOV" --body-file tisina.md --label tisina
          fi

      - name: Provjeri ima li otvorenih stipendija
        id: provjera
        run: |
          python - << 'PYEOF'
          import json, os
          d = json.load(open("output.json", encoding="utf-8"))
          otv = [r for r in d if (r.get("status") or "").startswith("OTVORENO")]
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"broj={len(otv)}\n")
          redovi = []
          for r in otv:
              redovi.append(f"- **{r.get('naziv')}** — {r.get('status')}\n"
                            f"  - Iznos: {r.get('iznos') or 'nepoznato'}\n"
                            f"  - Rok: {r.get('rok_tekst') or 'nepoznato'}\n"
                            f"  - {r.get('url')}")
          open("poruka.md", "w", encoding="utf-8").write("\n".join(redovi) or "nema")
          PYEOF

      # Popis otvorenih stipendija nije upozorenje nego pregled stanja —
      # zato jedna prijava koja se prepisuje, a ne nova poslije svakog rada.
      - name: Osvjezi pregled otvorenih stipendija
        if: steps.provjera.outputs.broj != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create pregled --color ededed \
            --description "Pregled otvorenih stipendija" 2>/dev/null || true
          NASLOV="Otvorene stipendije: ${{ steps.provjera.outputs.broj }} ($(date +'%d.%m.%Y'))"
          N=$(gh issue list --state open --label pregled --limit 1 \
                --json number --jq '.[0].number // empty')
          if [ -n "$N" ]; then
            gh issue edit "$N" --title "$NASLOV" --body-file poruka.md
          else
            gh issue create --title "$NASLOV" --body-file poruka.md --label pregled
          fi
