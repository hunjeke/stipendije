name: Provjera stipendija

on:
  schedule:
    # Ponedjeljak i cetvrtak u 07:00 UTC (09:00 po hrvatskom ljetnom vremenu)
    - cron: '0 7 * * 1,4'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  provjeri:
    runs-on: ubuntu-latest
    steps:
      - name: Preuzmi kod
        uses: actions/checkout@v4

      - name: Postavi Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instaliraj pakete
        run: pip install anthropic requests beautifulsoup4 pypdf

      - name: Pokreni scraper
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scraper.py
      - name: Generiraj javnu stranicu
        run: python web.py
      - name: Spremi rezultate u repozitorij
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A output.html output.json output.csv .cache.json docs || true
          git diff --staged --quiet || git commit -m "Rezultati provjere $(date +'%d.%m.%Y')"
          git push || true

      - name: Sacuvaj rezultate za preuzimanje
        uses: actions/upload-artifact@v4
        with:
          name: rezultati
          path: |
            output.html
            output.json

      - name: Provjeri sute li izvori
        id: tisina
        run: python provjeri_tisinu.py

      - name: Obavijest o tihim izvorima
        if: steps.tisina.outputs.broj_tihih != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Izvori koji šute: ${{ steps.tisina.outputs.broj_tihih }} ($(date +'%d.%m.%Y'))" \
            --body-file tisina.md

      - name: Provjeri ima li otvorenih stipendija
        id: provjera
        run: |
          python - << 'PYEOF'
          import json, os
          d = json.load(open("output.json", encoding="utf-8"))
          otv = [r for r in d if (r.get("status") or "").startswith("OTVORENO")]
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"broj={len(otv)}\n")
          redovi = []
          for r in otv:
              redovi.append(f"- **{r.get('naziv')}** — {r.get('status')}\n"
                            f"  - Iznos: {r.get('iznos') or 'nepoznato'}\n"
                            f"  - Rok: {r.get('rok_tekst') or 'nepoznato'}\n"
                            f"  - {r.get('url')}")
          open("poruka.md", "w", encoding="utf-8").write("\n".join(redovi) or "nema")
          PYEOF

      - name: Otvori obavijest ako ima otvorenih
        if: steps.provjera.outputs.broj != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Otvorene stipendije: ${{ steps.provjera.outputs.broj }} ($(date +'%d.%m.%Y'))" \
            --body-file poruka.md
