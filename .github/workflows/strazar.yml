name: Straža

# Javi se čim se natječaj pojavi na izvoru koji čekamo.
#
# Redovni scrape ide ponedjeljkom i četvrtkom, a poziv može izaći u
# utorak. Ovo ide svakog jutra, ne troši model i ne dira stranicu —
# samo pogleda izvor i otvori issue. GitHub o novom issueu šalje mail.

on:
  schedule:
    - cron: "40 5 * * *"      # svaki dan u 7:40 po hrvatskom (6:40 ljeti UTC+2)
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  straza:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instaliraj knjižnice
        run: pip install requests beautifulsoup4

      - name: Pogledaj izvore
        id: straza
        continue-on-error: true
        run: python straza.py

      # Issue se otvara samo kad straza nesto nade. GitHub o njemu salje
      # mail vlasniku repozitorija — zato se ne treba nista dodatno slati.
      - name: Javi
        if: steps.straza.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Straža: provjeri izvor ($(date +'%d.%m.%Y'))" \
            --body-file straza.md

      # Otisak stranice se pamti da se ista promjena ne javlja svaki dan.
      - name: Zapamti stanje
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .straza.json
          git diff --cached --quiet || git commit -m "straža: stanje izvora"
          git push
