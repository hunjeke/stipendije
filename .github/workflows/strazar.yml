name: Stražar

# Gleda izlazi li natječaj za državnu stipendiju — socio-ekonomsku i STEM.
#
# Redovni scrape ide ponedjeljkom i četvrtkom. Ministarstvo zna objaviti u
# utorak poslijepodne, a rok je kratak, pa bi se saznalo tek u četvrtak
# ujutro. Ovo ide triput na dan, ne troši model i ne dira stranicu — samo
# pogleda izvor i, ako nešto nađe, otvori issue. GitHub o novom issueu
# šalje mail.

on:
  schedule:
    - cron: "20 5 * * *"       # 7:20 po hrvatskom (ljeti UTC+2)
    - cron: "20 10 * * *"      # 12:20
    - cron: "20 15 * * *"      # 17:20
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  strazar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instaliraj knjižnice
        run: pip install requests beautifulsoup4

      - name: Pogledaj izvore
        id: gledaj
        run: python strazar.py

      # Pamćenje mora preživjeti pokretanje — bez ovoga bi isti natječaj
      # javljao svakih pet sati dok ga ne ugasiš.
      - name: Zabilježi javljeno
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add strazar.json
          if git diff --cached --quiet; then
            echo "strazar.json nepromijenjen"
            exit 0
          fi
          git commit -m "stražar: javljeno $(date +%F)"
          # Strazar se vrti tri puta dnevno pa najcesce od svih naleti na
          # tudi commit u mainu. Bez rebasea push padne, a 29.10.2026. je
          # upravo takav pad u provjeri progutao 21 minutu citanja.
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then
              exit 0
            fi
            echo "push nije prosao ($i/3) — pokusavam ponovno"
            sleep 5
          done
          echo "::error::strazar.json nije spremljen — push odbijen tri puta"
          exit 1

      # Jedna prijava koja se osvjezava umjesto nove pri svakom nalazu.
      # Strazar gleda tri puta dnevno, pa je do 2.11.2026. sam otvorio
      # cetiri jednake prijave koje nitko nije zatvorio. Zatvara je covjek
      # kad obavi posao — dotad je samo jedna i zato se vidi.
      - name: Prijava o mogucoj objavi
        if: steps.gledaj.outputs.naslo != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create strazar --color 0e8a16 \
            --description "Stražar javlja moguću objavu" 2>/dev/null || true
          NASLOV="Moguća objava državne stipendije — $(date +%d.%m.)"
          N=$(gh issue list --state open --label strazar --limit 1 \
                --json number --jq '.[0].number // empty')
          if [ -n "$N" ]; then
            gh issue edit "$N" --title "$NASLOV" --body-file strazar.md
          else
            gh issue create --title "$NASLOV" --body-file strazar.md --label strazar
          fi
